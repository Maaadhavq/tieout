pairs:
  - [M1, M2, CORROBORATES,             "same frame; 2024-25 == FY2024/25; different publishers and phrasing"]
  - [M1, M3, CONTEXTUALLY_RECONCILED,  "vintage: realized vs first advance estimate"]
  - [M1, M4, CONTEXTUALLY_RECONCILED,  "measure: GDP at constant prices vs GVA at basic prices"]
  - [M5, M6, CONTRADICTS,              "both projections for 2025-26; 6.5 vs 6.6"]
  - [D1, D2, CONTEXTUALLY_RECONCILED,  "consolidation: standalone vs consolidated"]
  # Rules cannot settle whether "revenue from operations" and "revenue from services"
  # name the same quantity, so this pair is the adjudicator's job. Without the alias
  # it must come back INSUFFICIENT_EVIDENCE, never a guess.
  - [D2, D3, CORROBORATES,             "81,415.38 million == 8,141.5 crore ~= 8,142 crore; needs metric alias"]
  - [D4, D5, CONTEXTUALLY_RECONCILED,  "state change over time: active in 2022, resigned 2023-08-24"]

# Negative controls: must NOT be paired or must not be labelled agreement.
non_pairs:
  - [M3, M4, "both 6.4% for the same period and entity, but GDP vs GVA AND a different
      estimate vintage -- two frame dimensions differ, so they are not one claim"]
  - [M2, M6, "a realized figure for FY2024/25 and a projection for FY2025/26 differ on both
      period and vintage; these are separate claims, not a reconciliation"]

# Known extraction failures, kept honest. See README Limitations.
known_failures:
  - doc: india-macroeconomy/03-imf-india-2025-article-iv-excerpt.pdf
    page: 1
    reason: image-only cover page, no text layer; would need OCR
  - doc: delhivery/03-delhivery-q4-fy24-earnings-presentation.pdf
    page: 8
    reason: >
      column-major table text stream. Row labels and the four period columns
      (Q4 FY22 / Q4 FY23 / Q3 FY24 / Q4 FY24) are emitted as separate runs, so a
      flat-text extractor cannot bind a value to its period without geometry.
      The grounding gate rejects these because the model's quote is not contiguous
      in the page text.
